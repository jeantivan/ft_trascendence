# Development override: use with `make dev`, never alone.
# Runs `next dev` with the local ./web folder mounted, so changes reload without rebuilding.
services:
  app:
    image: transcendence-app-dev
    build:
      target: dev
    # root only with rootless Docker (the campus), where node cannot enter the mounted
    # ./web; the Makefile sets it (scripts/container-user.sh, #236). Otherwise node
    user: "${DEV_CONTAINER_USER:-node}"
    environment:
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
    volumes:
      - ./web:/app
      # Keep the container's node_modules (Linux/Alpine binaries) instead of the host's
      - /app/node_modules
