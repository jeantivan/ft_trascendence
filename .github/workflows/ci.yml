name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    # Real Postgres for the integration tests that need LISTEN/NOTIFY (#22).
    # Throwaway credentials: this database only lives during the CI job.
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: transcendence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d transcendence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - run: make check-compose
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/transcendence_test
          DATABASE_URL_TEST: postgresql://test:test@localhost:5432/transcendence_test
      - run: npm run build
      - run: sh scripts/env-sync.test.sh
        working-directory: .

  # nginx is the only way in, over HTTPS (#59): start everything as make does,
  # then run the checks of make test-nginx (it waits for the app to start).
  # Runs in parallel with web.
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make
      - run: make test-nginx
      - if: failure()
        run: docker compose logs
      - if: always()
        run: make down
