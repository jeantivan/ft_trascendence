# The only way in: HTTPS on 8443, forwarded to the app and to the test mail inbox over
# Docker's internal network.
# Replaces the image's default site (/etc/nginx/conf.d/default.conf).

# Connection header for the proxied services: "upgrade" only when the browser asks for a
# WebSocket (next dev uses one to reload the page on save), "close" otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Inside the container it is always 8443; the host port comes from HTTPS_PORT
    listen 8443 ssl;
    server_name localhost;

    # Created on start by /docker-entrypoint.d/40-generate-cert.sh (certs volume)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    # Only the current version: the subject only asks for the latest Chrome
    ssl_protocols TLSv1.3;

    # Do not reveal the nginx version in headers and error pages
    server_tokens off;

    # nginx rejects bodies over 1 MB by default (413): profile photos (#23) need more
    client_max_body_size 5m;

    # No HSTS (Strict-Transport-Security) on purpose: browsers ignore it with a
    # self-signed certificate, and they would apply it to every app on localhost,
    # whatever the port. A real deployment with its own domain would add it.

    # Test mail inbox (#93). absolute_redirect off: the redirect would point to the
    # port inside the container (8443), not the one the browser used
    location = /mailpit {
        absolute_redirect off;
        return 301 /mailpit/;
    }

    location /mailpit/ {
        # No path after the port: mailpit gets /mailpit/..., its MP_WEBROOT
        proxy_pass http://mailpit:8025;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Lets WebSocket connections through (the inbox updates itself)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        # The address the browser used (with the port), so the app builds
        # https://localhost:8443/... links and not http://0.0.0.0:3000 (#60)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Lets WebSocket connections through (hot reload in make dev)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
