# The only way in: HTTPS on 8443, forwarded to the app and to the test mail inbox over
# Docker's internal network.
# Replaces the image's default site (/etc/nginx/conf.d/default.conf).

# Connection header for the proxied services: "upgrade" only when the browser asks for a
# WebSocket (next dev uses one to reload the page on save), "close" otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Logs without what comes after "?" in a link (#185): the data export (#165) sends its
# download token there. The image's default format logs $request, the whole first line
# of the request; this one logs $uri, the path alone. $uri is decoded: a "?" written
# as %3F inside the path shows as "?" here. That is part of the path, not of the "?"
# part, and tokens never go in the path (AGENTS.md). The Referer (the page the
# browser came from) is cut at "?" too, since that page's address can carry a token.
# Referrer-Policy (below) already keeps the path out of the Referer; this cut is for
# clients that ignore it and for pages loaded before the header existed
map $http_referer $referer_path {
    # No Referer: "-", as in the image's default format
    ""                         "-";
    "~^(?<before_query>[^?]*)" $before_query;
}

log_format no_query '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$referer_path" "$http_user_agent" "$http_x_forwarded_for"';

server {
    # Inside the container it is always 8443; the host port comes from HTTPS_PORT
    listen 8443 ssl;
    # HTTP/2 to the browser (#61): many requests share one connection. With
    # HTTP/1.1 the browser opens at most 6 per address, and every tab keeps one
    # busy with /api/events, so a 7th tab would hang
    http2 on;
    server_name localhost;

    # Created on start by /docker-entrypoint.d/40-generate-cert.sh (certs volume)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    # Only the current version: the subject only asks for the latest Chrome
    ssl_protocols TLSv1.3;

    # Do not reveal the nginx version in headers and error pages
    server_tokens off;

    # Same destination as the image (/var/log/nginx/access.log is docker logs), with
    # the format above
    access_log /var/log/nginx/access.log no_query;

    # nginx rejects bodies over 1 MB by default (413): profile photos (#23) need more
    client_max_body_size 5m;

    # No HSTS (Strict-Transport-Security) on purpose: browsers ignore it with a
    # self-signed certificate, and they would apply it to every app on localhost,
    # whatever the port. A real deployment with its own domain would add it.

    # The browser sends only the origin in the Referer, never the path or the "?"
    # part (#185): nginx copies the Referer into every error log line, in a format
    # that cannot change, so a page such as /verify-email?token=... would leave its
    # token there if one of its requests failed. Not no-referrer: with it the
    # browser sends "Origin: null" on form posts, and Next rejects Server Actions
    # whose Origin does not match the host. always: also on error pages (4xx, 5xx).
    # Set here for every location: a location with an add_header or a
    # proxy_hide_header of its own would drop these. proxy_hide_header: the test
    # mail inbox (#93) sends its own (no-referrer), and two values would leave the
    # browser to pick one
    add_header Referrer-Policy "strict-origin" always;
    proxy_hide_header Referrer-Policy;

    # Look up the app's address on each request (cached 10 s) instead of once at
    # start: when the app container is recreated it can get a new IP, and nginx
    # would keep sending to the old one (502) until restarted. 127.0.0.11 is
    # Docker's internal DNS. nginx only looks the name up again when proxy_pass
    # uses a variable, so the address goes in $app_upstream
    resolver 127.0.0.11 valid=10s;
    set $app_upstream http://app:3000;

    # Set here, for every location below. A location that sets any
    # proxy_set_header of its own inherits none of these
    proxy_http_version 1.1;

    # The address the browser used (with the port), so the app builds
    # https://localhost:8443/... links and not http://0.0.0.0:3000 (#60)
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

    # Lets WebSocket connections through (hot reload in make dev)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Test mail inbox (#93). absolute_redirect off: the redirect would point to the
    # port inside the container (8443), not the one the browser used
    location = /mailpit {
        absolute_redirect off;
        return 301 /mailpit/;
    }

    # The headers above (address, HTTPS and WebSocket, so the inbox updates itself)
    # also apply here. A fixed address is fine: if mailpit is recreated, only the
    # test inbox fails until nginx restarts, not the app
    location /mailpit/ {
        # No path after the port: mailpit gets /mailpit/..., its MP_WEBROOT
        proxy_pass http://mailpit:8025;
    }

    location / {
        proxy_pass $app_upstream;
    }

    # Data export download (#165): its link carries a token after "?". The error log
    # copies the whole request, token included, and its format cannot change, so on
    # this route it keeps only critical errors. A failed download still shows in the
    # access log with its status (502, 413...), without the token.
    # The error log level can only change per location, not by what comes after "?":
    # any new route whose link carries a token needs a block like this one (AGENTS.md).
    # The path is in three places: here, web/next.config.ts and check 18 of
    # scripts/nginx.test.sh. If #165 changes it, change all three
    location ~ ^/api/gdpr/export/[^/]+/download/?$ {
        error_log /var/log/nginx/error.log crit;
        proxy_pass $app_upstream;
    }

    # The real-time stream (SSE, ADR 0001): one connection per tab that stays open
    location = /api/events {
        proxy_pass $app_upstream;

        # Send each event on at once instead of waiting to fill a buffer. The app
        # also sends X-Accel-Buffering: no; this keeps it true if that header goes
        proxy_buffering off;

        # Close the stream after 60 s without data. Same as nginx's default, written
        # here so the limit is visible. The app pings every 15 s, so only a stuck
        # app hits this, and the browser then reconnects on its own
        proxy_read_timeout 60s;
    }
}
