name: transcendence

services:
  db:
    image: postgres:18.4-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies the pending Prisma migrations, then exits.
  # app only starts if this finished without errors.
  migrate:
    build:
      context: ./web
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: ./web
    environment:
      # Built from the .env values, so the password lives only in .env.
      # "db" is the service name: Docker's internal DNS resolves it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      # Read from .env; off unless it is exactly "true". See .env.example.
      LEGAL_DRAFTS_ENABLED: ${LEGAL_DRAFTS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No ports: only nginx is reachable from outside Docker (HTTPS only)
    restart: unless-stopped

  # The only entry point: HTTPS on the host port HTTPS_PORT (8443 by default),
  # forwarded to app:3000 over Docker's internal network. See nginx/app.conf.
  nginx:
    build: ./nginx
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      # Self-signed certificate and its key, created on first start.
      # Only nginx mounts it; make fclean deletes it and the next start makes a new one.
      - certs:/etc/nginx/certs
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  certs:
