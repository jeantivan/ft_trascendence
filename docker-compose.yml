name: transcendence

services:
  db:
    image: postgres:18.4-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: applies the pending Prisma migrations, then exits.
  # app only starts if this finished without errors.
  migrate:
    build:
      context: ./web
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: ./web
    environment:
      # Built from the .env values, so the password lives only in .env.
      # "db" is the service name: Docker's internal DNS resolves it.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # TEMPORARY: remove when NGINX is added. Only NGINX may publish ports (HTTPS only). See issue #14.
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
